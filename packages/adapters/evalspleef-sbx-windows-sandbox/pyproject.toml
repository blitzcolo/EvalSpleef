[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalspleef-sbx-windows-sandbox"
version = "0.1.0"
description = "Sandbox provider: Windows Sandbox (developer self-test only)."
requires-python = ">=3.12"
dependencies = ["evalspleef-spi"]

[project.entry-points."evalspleef.sandbox_providers"]
windows-sandbox = "evalspleef_sbx_windows_sandbox.provider:WindowsSandboxProvider"

[project.entry-points."evalspleef.conformance_targets"]
windows-sandbox = "evalspleef_sbx_windows_sandbox.conformance:build_targets"

[tool.hatch.build.targets.wheel]
packages = ["src/evalspleef_sbx_windows_sandbox"]

[tool.hatch.build.targets.wheel.force-include]
"src/evalspleef_sbx_windows_sandbox/isolation_profile.yaml" = "evalspleef_sbx_windows_sandbox/isolation_profile.yaml"
"src/evalspleef_sbx_windows_sandbox/probes" = "evalspleef_sbx_windows_sandbox/probes"

[tool.uv.sources]
evalspleef-spi = { workspace = true }

[tool.pytest.ini_options]
# The documented command loads the conformance kit explicitly with
# ``-p evalspleef.conformance.plugin``; the package also installs it as a
# pytest11 entry point, and pytest 9 rejects the duplicate registration.
addopts = "-p no:spleef-conformance --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]
