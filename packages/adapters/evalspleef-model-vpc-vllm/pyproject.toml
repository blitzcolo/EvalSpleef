[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalspleef-model-vpc-vllm"
version = "0.1.0"
description = "Model provider: self-hosted vLLM/SGLang on Kubernetes or GPU instances."
requires-python = ">=3.12"
dependencies = ["evalspleef-spi", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
k8s = ["kubernetes>=30"]

[project.entry-points."evalspleef.model_providers"]
vpc-vllm = "evalspleef_model_vpc_vllm.provider:VpcVllmProvider"

[project.entry-points."evalspleef.conformance_targets"]
vpc-vllm = "evalspleef_model_vpc_vllm.conformance:build_targets"

[tool.hatch.build.targets.wheel]
packages = ["src/evalspleef_model_vpc_vllm"]

[tool.uv.sources]
evalspleef-spi = { workspace = true }
