[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalspleef-sbx-e2b-family"
version = "0.1.0"
description = "Sandbox providers: novita-sandbox and e2b-selfhost sharing an E2B-family base class."
requires-python = ">=3.12"
dependencies = ["evalspleef-spi", "novita-sandbox>=2.1,<3"]

[project.optional-dependencies]
selfhost = ["e2b>=1"]

[project.entry-points."evalspleef.sandbox_providers"]
novita-sandbox = "evalspleef_sbx_e2b_family.novita:NovitaSandboxProvider"
e2b-selfhost = "evalspleef_sbx_e2b_family.selfhost:E2BSelfHostProvider"

[project.entry-points."evalspleef.conformance_targets"]
e2b-family = "evalspleef_sbx_e2b_family.conformance:build_targets"

[tool.hatch.build.targets.wheel]
packages = ["src/evalspleef_sbx_e2b_family"]

[tool.uv.sources]
evalspleef-spi = { workspace = true }
