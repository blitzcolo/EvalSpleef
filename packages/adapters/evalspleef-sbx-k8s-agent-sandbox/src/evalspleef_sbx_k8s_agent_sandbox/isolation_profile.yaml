# Isolation profile for the Kubernetes agent-sandbox provider (FR-SBX-11).
# I1-I16 per PRD appendix D.2; evalspleef_sbx_k8s_agent_sandbox.isolation is the
# runtime source of truth - keep both in sync, the tests enforce the keys.
provider: k8s-agent-sandbox
declared_isolation: L2
verified_isolation: null
invariants:
  I1:
    how: 'every trial gets a fresh Sandbox custom resource named spleef-<nonce>; the SPI labels including the lease id are copied onto the object, and the object is deleted after the trial'
    probe: 'list(labels) returns exactly one Sandbox per lease while live'
    waived: false
  I2:
    how: 'the pod container runs with readOnlyRootFilesystem; only the emptyDir volumes mounted at /workspace and /tmp are writable'
    probe: 'findmnt -no OPTIONS / starts with ro and touch /.__probe fails'
    waived: false
  I3:
    how: '/workspace and /tmp are per-pod emptyDir volumes; no hostPath or persistent volume is ever mounted into an agent sandbox'
    probe: 'a marker written by one sandbox is absent in the next sandbox'
    waived: false
  I4:
    how: 'NetMode.OFF creates a CiliumNetworkPolicy with an empty egress list, which Cilium applies as default-deny egress; full access is a deployment decision logged outside the sandbox'
    probe: 'curl --max-time 3 https://example.com exits non-zero in an off sandbox'
    waived: false
  I5:
    how: 'automountServiceAccountToken is false, no hostPath volume exists, capabilities drop ALL, allowPrivilegeEscalation is false and the pod uses the RuntimeDefault seccomp profile'
    probe: 'the mount table shows no host path and no service-account token'
    waived: false
  I6:
    how: 'the pod security context sets runAsNonRoot (and runAsUser when the spec names a numeric account); task images must not ship passwordless sudo'
    probe: 'id -u is not 0 and sudo -n true fails'
    waived: false
  I7:
    how: 'cpu and memory requests equal their limits, so the kubelet enforces them through cgroups; ephemeral storage is requested and limited for the workspace volume'
    probe: 'cpu.max and memory.max match the requested resources'
    waived: false
  I8:
    how: "the pod hostname is the neutral constant 'sandbox'; the provider adds no task, batch or model variables to the environment, only the SPI env"
    probe: 'env contains no TASK/BATCH/MODEL/EVAL-style names'
    waived: false
  I9:
    how: 'the image is referenced as ref@sha256:... when the template digest is real; the only credential allowed in the sandbox is the per-trial gateway key, which the provider never injects'
    probe: 'the pod image field carries a sha256 digest'
    waived: false
  I10:
    how: 'verifier and judge roles are separate SandboxSpec roles scheduled to their own Sandbox objects and leases'
    probe: 'verifier_lease_id != agent_lease_id for a trial'
    waived: false
  I11:
    how: 'download extracts the tar stream with sanitisation: escaping symlinks, special files, setuid bits and oversized members are rejected'
    probe: 'downloading a symlink pointing at /etc/passwd raises TransferError'
    waived: false
  I12:
    how: 'hidden tests never enter agent images; hash locks live in the task pack, which the provider does not touch'
    probe: 'tests.sha256 manifest matches the verifier-side files'
    waived: false
  I13:
    how: 'every trial creates a new Sandbox and pod with emptyDir storage, so no state carries over; canary placement is a runner concern'
    probe: 'cross-trial canary scan reports zero critical hits'
    waived: false
  I14:
    how: 'warm-pool instances are only claimed through a SandboxClaim and are never returned to the pool: destroy deletes the claim and its sandbox, and reap deletes orphans by label and lifetime'
    probe: 'destroy is idempotent and list(labels) is empty afterwards'
    waived: false
  I15:
    how: 'judge contexts run in their own trial-scoped Sandbox like any other role'
    probe: 'judge session is unique per trial'
    waived: false
  I16:
    how: 'docs_whitelist/package_mirror generate Cilium toFQDNs rules plus a DNS rule; off is default-deny; full networking stays platform-logged'
    probe: 'a non-allowlisted hostname is unreachable and the proxy/CNI logs one record per request'
    waived: false
