# Isolation profile for the docker sandbox provider (FR-SBX-11).
# I1-I16 per PRD appendix D.2; generated from evalspleef_sbx_docker.isolation
# (the runtime source of truth) - keep both in sync, the tests enforce it.
provider: docker
declared_isolation: L1
verified_isolation: null
invariants:
  I1:
    how: 'every trial gets a fresh container from an immutable image and the container is destroyed after the trial; the lease id is recorded as a label'
    probe: "$ test $(( $(date +%s) - $(stat -c %Y /proc/1) )) -lt 900"
    waived: false
  I10:
    how: 'verifier and judge roles are separate SandboxSpec roles scheduled to their own containers and leases; the provider never mixes them'
    probe: 'verifier_lease_id != agent_lease_id for a trial'
    waived: false
  I11:
    how: 'download sanitises the artifact stream: symlinks that resolve outside the export root, special files and setuid bits are rejected, sizes are capped'
    probe: 'downloading a symlink pointing at /etc/passwd raises TransferError'
    waived: false
  I12:
    how: 'hidden tests never enter agent-side images; hash locks live in the task pack, which the provider does not touch; upload(read_only=True) unpacks a tree as root without group/other write bits'
    probe: 'tests.sha256 manifest matches the verifier-side files'
    waived: false
  I13:
    how: 'the provider creates a fresh container per trial so no state can carry over; canary token placement is a runner/control-plane concern'
    probe: 'cross-trial canary scan reports zero critical hits'
    waived: false
  I14:
    how: 'containers are destroyed at trial end and never returned to a pool; orphans are reclaimed by label through reap() and the TTL sweep'
    probe: 'list(labels) is empty after destroy; spleef.expires_at bounds the container lifetime'
    waived: false
  I15:
    how: 'judge contexts run in their own trial-scoped container like any other role'
    probe: 'judge session is unique per trial'
    waived: false
  I16:
    how: 'docs_whitelist/package_mirror are only offered when the provider config names an egress network and the policy carries via_proxy, so all allowlisted traffic flows through the logging egress proxy; full networking stays platform-logged'
    probe: "the egress proxy's url.jsonl has one line per request; direct egress bypass is not offered"
    waived: false
  I2:
    how: 'containers are created with a read-only root filesystem; the only writable paths are tmpfs mounts (/tmp, the agent home, /workspace and the paths the spec declares in writable_paths)'
    probe: "$ ! touch /.spleef-probe 2>/dev/null"
    waived: false
  I3:
    how: '/tmp, the agent home, /workspace and declared writable paths are per-trial tmpfs mounts; no host directory is ever bind-mounted into the container'
    probe: "$ awk '$2 == \"/tmp\" { t = $3 } END { exit t != \"tmpfs\" }' /proc/mounts"
    waived: false
  I4:
    how: "every container gets a private network namespace; NetMode.OFF maps to the Docker 'none' network so there is no external egress"
    probe: "$ test ! -e /sys/class/net/docker0"
    waived: false
  I5:
    how: 'no host bind mounts, no Docker socket, --cap-drop ALL and no-new-privileges on every container'
    probe: "$ test ! -S /var/run/docker.sock && test ! -S /run/docker.sock && ! grep -Eq '^CapEff:[[:space:]]*0*[13]?f{9,}' /proc/self/status"
    waived: false
  I6:
    how: 'containers run as the non-root run_as_user; task images must not ship sudo (the conformance test image installs none)'
    probe: "$ test \"$(id -u)\" != 0 && ! sudo -n true 2>/dev/null"
    waived: false
  I7:
    how: 'cpu (nano_cpus), memory (memory + equal memory_swap) and pids (pids_limit) are enforced through cgroup v2'
    probe: "$ test \"$(cat /sys/fs/cgroup/memory.max)\" != max && test \"$(cat /sys/fs/cgroup/pids.max)\" != max"
    waived: false
  I8:
    how: 'the provider injects no evaluation identity: no task, batch or model variables enter the container environment and the hostname is the neutral container id'
    probe: "$ ! env | grep -Eq '^[A-Z_]*(TASK|BATCH|MODEL|EVAL)[A-Z_]*='"
    waived: false
  I9:
    how: 'images are referenced by digest in TemplateRef and pulled by digest when not present locally; the only credential allowed in a sandbox is the per-trial gateway key, which the provider never injects'
    probe: "$ ! env | grep -Eiq '^[a-z_]*(api_key|secret|token|password)[a-z_]*='"
    waived: false
