# Isolation profile for the apple-container sandbox provider (FR-SBX-11).
# I1-I16 per PRD appendix D.2; generated from evalspleef_sbx_apple_container.isolation
# (the runtime source of truth) - keep both in sync, the tests enforce it.
provider: apple-container
declared_isolation: L3
verified_isolation: null
invariants:
  I1:
    how: every trial boots a fresh lightweight VM (its own guest kernel) from an immutable OCI image and
      the container is deleted after the trial; the lease id is a label
    probe: $ test "$(cut -d. -f1 /proc/uptime)" -lt 900
    waived: false
  I2:
    how: containers start with --read-only (the root is a read-only ext4 block device); the only writable
      paths are the tmpfs mounts /tmp, /workspace and /home/<run_as_user>, plus the paths a spec declares in
      writable_paths. Files move as tar streams over exec as the sandbox user; the host-side 'container cp'
      writes beneath --read-only and under the tmpfs mounts, so the provider never uses it
    probe: $ ! touch /.spleef-probe 2>/dev/null
    waived: false
  I3:
    how: the VM root is per-trial and /workspace, /tmp, the agent home (and declared writable paths)
      are tmpfs in guest memory; no host directory is shared into the VM (no --volume, --mount or virtiofs
      share)
    probe: $ awk '$2 == "/workspace" { t = $3 } END { exit t != "tmpfs" }' /proc/mounts
    waived: false
  I4:
    how: 'every container is its own VM with its own kernel network stack. NetMode.OFF runs it with ''--network
      none'': loopback only, no route, no DNS, no host. NetMode.FULL attaches the ''default'' vmnet NAT
      network. An ''--internal'' network is host-only (the VM reaches every service listening on the host),
      so it is never used for OFF'
    probe: $ test -z "$(ls /sys/class/net | grep -Ev '^(lo|eth0)$')"
    waived: false
  I5:
    how: no --volume/--mount/--ssh/--publish/--publish-socket/--virtualization flags, --cap-drop ALL (effective
      capabilities are empty, root included) and a read-only root on every container; no container-runtime
      socket exists in the guest
    probe: $ ! grep -q ' virtiofs ' /proc/mounts && grep -Eq '^CapEff:[[:space:]]*0+$' /proc/self/status
      && test ! -S /var/run/docker.sock && test ! -S /run/docker.sock
    waived: false
  I6:
    how: the init process and every exec run as the non-root run_as_user (--user); the account must exist
      in the image (the CLI refuses an unknown user at start) and task images must not ship sudo
    probe: $ test "$(id -u)" != 0 && ! sudo -n true 2>/dev/null
    waived: false
  I7:
    how: '''--cpus'' sets the guest cgroup cpu.max to cpus x 100000 (the VM gets one extra vCPU of overhead,
      so nproc reports cpus + 1); ''--memory'' sets memory.max to exactly memory_mb (the VM''s RAM is
      slightly larger). pids.max stays ''max'' and there is no disk quota'
    probe: $ test "$(cat /sys/fs/cgroup/memory.max)" != max && test "$(cut -d' ' -f1 /sys/fs/cgroup/cpu.max)"
      != max
    waived: true
    reason: the container CLI enforces cpu and memory but has no pids limit and no disk quota for a container
    compensating: each sandbox is its own VM, so pid exhaustion stays inside its own guest kernel; every
      writable path is tmpfs charged to the memory cgroup (a write past memory.max is OOM-killed), so
      writable storage is bounded by memory_mb; the TTL sweep bounds the container lifetime
    approved_by: evaluation lead
    expires: '2027-06-30'
  I8:
    how: 'the provider injects no evaluation identity: only spec.env (task environment) plus proxy settings
      reach an exec. The container name is also the guest hostname, so name_prefix must stay neutral (default
      ''c-'')'
    probe: $ ! env | grep -Eq '^[A-Z_]*(TASK|BATCH|MODEL|EVAL)[A-Z_]*='
    waived: false
  I9:
    how: OCI images are referenced by digest in TemplateRef and run as ref@sha256:... (the CLI pulls and
      verifies that digest); the only credential allowed in a sandbox is the per-trial gateway key, which
      the provider never injects
    probe: $ ! env | grep -Eiq '^[a-z_]*(api_key|secret|token|password)[a-z_]*='
    waived: false
  I10:
    how: verifier and judge roles are separate SandboxSpec roles scheduled to their own containers and
      leases; the provider never mixes them
    probe: verifier_lease_id != agent_lease_id for a trial
    waived: false
  I11:
    how: 'download re-validates the copied tree: absolute or escaping symlinks and special files are rejected,
      setuid/setgid bits are cleared, sizes are capped'
    probe: downloading a symlink pointing at /etc/passwd raises TransferError
    waived: false
  I12:
    how: hidden tests never enter agent-side images; hash locks live in the task pack, which the provider
      does not touch; upload(read_only=True) unpacks a tree as root without group/other write bits
    probe: tests.sha256 manifest matches the verifier-side files
    waived: false
  I13:
    how: the provider creates a fresh container per trial so no state can carry over; canary token placement
      is a runner/control-plane concern
    probe: cross-trial canary scan reports zero critical hits
    waived: false
  I14:
    how: containers are removed at trial end and never returned to a pool; orphans are reclaimed by label
      through reap() and the TTL sweep, and every container carries spleef.created_at / spleef.expires_at
    probe: list(labels) is empty after destroy; spleef.expires_at bounds the lifetime
    waived: false
  I15:
    how: judge contexts run in their own trial-scoped container like any other role
    probe: judge session is unique per trial
    waived: false
  I16:
    how: docs_whitelist/package_mirror are only offered when the provider config names an egress proxy
      and the policy carries via_proxy; the container then sits on an internal (host-only) network with
      no route off the host and is pointed at the proxy, which logs URLs. A host-only network also exposes
      every other service listening on the host's address there, so the proxy host must expose nothing
      else on it. Open networking stays platform-logged
    probe: the egress proxy's url.jsonl has one line per request; direct egress bypass is not offered
    waived: false
