[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalspleef-sbx-libvirt"
version = "0.1.0"
description = "Sandbox provider: libvirt/QEMU/KVM guests."
requires-python = ">=3.12"
dependencies = ["evalspleef-spi", "asyncssh>=2.17"]

[project.entry-points."evalspleef.sandbox_providers"]
libvirt = "evalspleef_sbx_libvirt.provider:LibvirtProvider"

[project.entry-points."evalspleef.conformance_targets"]
libvirt = "evalspleef_sbx_libvirt.conformance:build_targets"

[tool.hatch.build.targets.wheel]
packages = ["src/evalspleef_sbx_libvirt"]

[tool.uv.sources]
evalspleef-spi = { workspace = true }
