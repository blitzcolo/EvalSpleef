[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalspleef-sbx-libvirt"
version = "0.1.0"
description = "Sandbox provider: libvirt/QEMU/KVM guests."
requires-python = ">=3.12"
dependencies = ["evalspleef-spi", "asyncssh>=2.17"]

[project.entry-points."evalspleef.sandbox_providers"]
libvirt = "evalspleef_sbx_libvirt.provider:LibvirtProvider"

[project.entry-points."evalspleef.conformance_targets"]
libvirt = "evalspleef_sbx_libvirt.conformance:build_targets"

[tool.hatch.build.targets.wheel]
packages = ["src/evalspleef_sbx_libvirt"]

[tool.hatch.build.targets.wheel.force-include]
"src/evalspleef_sbx_libvirt/isolation_profile.yaml" = "evalspleef_sbx_libvirt/isolation_profile.yaml"
"src/evalspleef_sbx_libvirt/probes" = "evalspleef_sbx_libvirt/probes"

[tool.uv.sources]
evalspleef-spi = { workspace = true }

[tool.pytest.ini_options]
# The documented command loads the conformance kit explicitly with
# ``-p evalspleef.conformance.plugin``; the package also installs it as a
# pytest11 entry point, and pytest 9 rejects the duplicate registration.
addopts = "-p no:spleef-conformance --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]
