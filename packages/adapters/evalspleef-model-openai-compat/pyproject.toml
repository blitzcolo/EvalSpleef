[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalspleef-model-openai-compat"
version = "0.1.0"
description = "Model provider: any OpenAI-compatible endpoint (external management mode)."
requires-python = ">=3.12"
dependencies = ["evalspleef-spi", "httpx>=0.27"]

[project.entry-points."evalspleef.model_providers"]
openai-compatible = "evalspleef_model_openai_compat.provider:OpenAICompatibleProvider"

[project.entry-points."evalspleef.conformance_targets"]
openai-compat = "evalspleef_model_openai_compat.conformance:build_targets"

[tool.hatch.build.targets.wheel]
packages = ["src/evalspleef_model_openai_compat"]

[tool.uv.sources]
evalspleef-spi = { workspace = true }
