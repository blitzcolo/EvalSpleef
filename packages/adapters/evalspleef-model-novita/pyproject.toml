[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalspleef-model-novita"
version = "0.1.0"
description = "Model providers: novita-dedicated (assisted) and novita-serverless-gpu (api)."
requires-python = ">=3.12"
dependencies = ["evalspleef-spi", "httpx>=0.27"]

[project.entry-points."evalspleef.model_providers"]
novita-dedicated = "evalspleef_model_novita.dedicated:NovitaDedicatedProvider"
novita-serverless-gpu = "evalspleef_model_novita.serverless_gpu:NovitaServerlessGpuProvider"

[project.entry-points."evalspleef.conformance_targets"]
novita = "evalspleef_model_novita.conformance:build_targets"

[tool.hatch.build.targets.wheel]
packages = ["src/evalspleef_model_novita"]

[tool.uv.sources]
evalspleef-spi = { workspace = true }
