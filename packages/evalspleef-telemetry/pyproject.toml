[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalspleef-telemetry"
version = "0.1.0"
description = "Shared OpenTelemetry setup for every spleef process: OTLP/HTTP and OTLP/gRPC exporter selection through the standard environment variables."
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-grpc>=0.46b2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evalspleef"]
