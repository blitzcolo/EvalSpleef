# batch.yaml for a real-model development batch: two DeepSeek models on three Linux packs,
# judged by Claude Sonnet 5.5 and Gemini 4 Carbon through the gateway.
batch: 2026-11-b3
models: [deepseek-flash, deepseek-v4-pro]
shells:
  unified: terminus
  native: {}
tasks:
  include: [logic-001, data-001, debug-001]
epochs: 2 # docs/03 9.9 ranks a cell only with >= 2 valid epochs
budget:
  max_total_usd: 90 # worst case = every trial spends its pack cap (88 USD); expect a few dollars
endpoint_policy:
  warm_before_run: true
  retire_after: terminate
judges: [claude-sonnet-5-5, gemini-4-carbon]
agent_judge: # judge agents for agent_judge items (backend-001 R11/R13); absent = manual queue
  judges: [] # empty: the judges above also serve agent items
  k: 3 # samples per item; each boots one judge sandbox (the spec's 5 costs 5/3 as much)
  max_steps: 12 # executed actions per sample
  max_invalid_replies: 4 # replies without a valid action; the 5th ends the sample
  command_timeout_s: 60
  wall_clock_s: 300
  output_cap_bytes: 8192
  run_every_round: false # judge agents on the final verification only
pricing_table: "2026-11"
