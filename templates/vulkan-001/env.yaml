id: vulkan-001
version: 1.0.0
os: linux
base_image: python:3.12-slim
tag: llm-eval/vulkan-001:local
pack_ids:
  - vulkan-001
toolchains:
  python: "3.12"
  vulkan_sdk: "1.3"
  glslc: "vulkan-tools"
  cmake: "3.25"
  gcc: "12.x"
  bash: "5.2"
  patch: "2.7"
  coreutils: "9.1"
users:
