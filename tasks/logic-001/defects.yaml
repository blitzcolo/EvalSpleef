# logic-001 缺陷现象目录（F1/F2/F3 预写素材）
# 字段对齐 schemas/defect.schema.json 的 catalog 文档（document_type=catalog）。
document_type: catalog
schema_version: "1.0"
task_id: logic-001
catalog_version: 1.0.0

items:
  - rubric_item_id: R1
    title: 答案文件不可解析
    severity: fatal
    f1_symptom: 交上来的东西我这边当数据读不出来，看着像一段带说明的文字。
    f2_evidence:
      kind: test_failure
      text: |
        解析失败：文件首个非空字符不是 { 或末尾不是 }。
        期望：顶层键集合 = {instances}；实际解析结果：<null>
      source_command: 验证侧解析 answer.json
      redactions: ["<PATH>"]
    detect:
      source: script
      check_ids: [verify_submission.HG2, checker.NOT_PURE_JSON]
    evidence_required: [file_path, command_output]
    tags: [format]

  - rubric_item_id: R2
    title: 规则或下一棋盘错误
    severity: fatal
    f1_symptom: 有几组推出来的下一步跟我手里的记录走势对不上。
    f2_evidence:
      kind: test_failure
      text: |
        实例 3：next[0] 期望 7，提交 3
        实例 5：rule.a 期望 7，提交 3
      source_command: 验证侧比对 answer.json
      redactions: []
    detect:
      source: script
      check_ids: [verify_submission.HG1, checker.NEXT_MISMATCH]
    evidence_required: [file_path]
    tags: [answer]

  - rubric_item_id: R3
    title: 提交规则无法复现记录
    severity: functional
    f1_symptom: 第 3 组你写的规则套回记录，走到中间一步就对不上了。
    f2_evidence:
      kind: test_failure
      text: |
        实例 3 自洽校验：第 2 次转移位置 4 记录为 7，按提交规则计算为 3。
      source_command: 验证侧自洽校验
      redactions: []
    detect:
      source: script
      check_ids: [checker.RULE_NOT_SELF_CONSISTENT]
    evidence_required: [file_path, command_output]
    tags: [consistency]

  - rubric_item_id: R4
    title: 受保护输入被修改
    severity: fatal
    f1_symptom: 你动过原始记录吗？我这边对不上最初的版本了。
    f2_evidence:
      kind: console_log
      text: |
        instances.json 哈希不一致：预置 <HASH_EXPECTED>，当前 <HASH_ACTUAL>
      source_command: 验证侧哈希锁检查
      redactions: ["<HASH_EXPECTED>", "<HASH_ACTUAL>"]
    detect:
      source: script
      check_ids: [verify_submission.HG3]
    evidence_required: [file_path]
    tags: [anti_cheat]

  - rubric_item_id: R5
    title: 规则字段超出规则族
    severity: functional
    f1_symptom: 规则那一栏看着不像表里的写法，像自己起的名。
    f2_evidence:
      kind: test_failure
      text: |
        实例 1：perm=rotate 不在允许集合
        实例 2：a=2 不在 {1,3,7,9}
      source_command: 验证侧枚举校验
      redactions: []
    detect:
      source: script
      check_ids: [checker.PERM_UNKNOWN, checker.A_OUT_OF_FAMILY]
    evidence_required: [file_path]
    tags: [format]

  - rubric_item_id: R6
    title: 推导缺少可复核依据
    severity: functional
    f1_symptom: 推导那段看不到能让我核对的依据，只有结论。
    f3_visual:
      description: 推导区只有结论性的一句话，没有任何带格子位置的数字对照。
      regions: ["答案文件的 derivation 文本区"]
    detect:
      source: llm_judge
      check_ids: [rubric.R6]
    evidence_required: [file_path]
    tags: [derivation]

  - rubric_item_id: R7
    title: 唯一性未说明
    severity: functional
    f1_symptom: 你写了唯一，但没说为什么能得到这个唯一。
    f3_visual:
      description: 推导结尾直接给结论，前文没有排除其他候选的句子。
      regions: ["答案文件的 derivation 文本区"]
    detect:
      source: llm_judge
      check_ids: [rubric.R7]
    evidence_required: [file_path]
    tags: [derivation, uniqueness]

  - rubric_item_id: R11
    title: 推导超长或含代码块
    severity: minor
    f1_symptom: 推导太长了，我找不到重点。
    f2_evidence:
      kind: test_failure
      text: |
        实例 2 推导长度 412 字符（上限 300）
      source_command: 验证侧格式校验
      redactions: []
    detect:
      source: script
      check_ids: [checker.DERIVATION_TOO_LONG]
    evidence_required: [file_path]
    tags: [format]

  - rubric_item_id: R12
    title: 缺少推导字段
    severity: fatal
    f1_symptom: 有一组只有结果没有推导，我没法判断是不是猜的。
    f2_evidence:
      kind: test_failure
      text: |
        结构校验输出：实例 4 缺少 derivation 字段
      source_command: 验证侧结构校验
      redactions: []
    detect:
      source: script
      check_ids: [checker.DERIVATION_MISSING]
    evidence_required: [file_path]
    tags: [format, derivation]

extensions:
  coverage:
    note: 覆盖全部 functional/fatal rubric 条目（R1-R7）；minor 条目按需复用同一条现象时需重新措辞。
  author: tasks-a
