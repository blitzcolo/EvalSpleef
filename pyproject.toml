[project]
name = "evalspleef-workspace"
version = "0.0.0"
description = "EvalSpleef monorepo root: tooling configuration only. Product code lives under packages/."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*", "packages/adapters/*"]
exclude = ["packages/adapters"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.11",
  "import-linter>=2.1",
  "types-PyYAML",
  "grpcio-tools>=1.66",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p pytester"
asyncio_mode = "auto"
testpaths = ["packages", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tasks", "docs", "packages/evalspleef-core/examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = [
  "E501",   # the formatter owns line wrapping
  "RUF001", # full-width punctuation appears in imported reference code and task content
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"packages/evalspleef-core/**" = ["UP042"]  # reference enums keep their (str, Enum) behaviour
"packages/evalspleef-core/tests/_gen_examples.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["evalspleef"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
packages = [
  "evalspleef.spi",
  "evalspleef.core",
  "evalspleef.telemetry",
  "evalspleef.egress",
  "evalspleef.gateway",
  "evalspleef.hostd",
  "evalspleef.runners",
  "evalspleef.conformance",
  "evalspleef.testing",
  "evalspleef.control",
  "evalspleef_model_openai_compat",
  "evalspleef_model_novita",
  "evalspleef_model_beam",
  "evalspleef_model_vpc_vllm",
  "evalspleef_sbx_docker",
  "evalspleef_sbx_e2b_family",
  "evalspleef_sbx_tart",
  "evalspleef_sbx_apple_container",
  "evalspleef_sbx_libvirt",
  "evalspleef_sbx_hyperv",
  "evalspleef_sbx_windows_sandbox",
  "evalspleef_sbx_k8s_agent_sandbox",
  "evalspleef_sbx_device_pool",
  "evalspleef_harbor_bridge",
]

