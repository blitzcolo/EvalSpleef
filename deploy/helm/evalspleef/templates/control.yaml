apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evalspleef.fullname" . }}-control
  labels:
    {{- include "evalspleef.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  replicas: {{ .Values.control.replicaCount }}
  selector:
    matchLabels:
      {{- include "evalspleef.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "control") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "evalspleef.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "control") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: configs-volume
          configMap:
            name: {{ include "evalspleef.fullname" . }}-configs
      containers:
        - name: control
          image: "{{ .Values.control.image.repository }}:{{ .Values.control.image.tag }}"
          imagePullPolicy: {{ .Values.control.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.control.service.port }}
              protocol: TCP
          env:
            - name: SPLEEF_GATEWAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.control.secretRefs.adminToken.secretName }}
                  key: {{ .Values.control.secretRefs.adminToken.key }}
            - name: SPLEEF_GATEWAY_ADMIN_URL
              value: "http://{{ include \"evalspleef.fullname\" . }}-gateway:8391"
          volumeMounts:
            - name: configs-volume
              mountPath: /etc/evalspleef
              readOnly: true
          resources:
            {{- toYaml .Values.control.resources | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.control.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.control.livenessProbe | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "evalspleef.fullname" . }}-control
  labels:
    {{- include "evalspleef.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  type: {{ .Values.control.service.type }}
  ports:
    - port: {{ .Values.control.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "evalspleef.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "control") | nindent 4 }}
